<!DOCTYPE html>
<html>
<head>
    <title>TrustVault - Create Account</title>
</head>
<body>
    <h2>Create Your TrustVault Account</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="/accounts/login/">Log in</a>
    </p>
</body>
</html>
